[env:esp32dev]
platform  = espressif32@3.5.0
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

board_build.partitions = huge_app.csv

; Replace the framework's default -Os with -O2 (speed over size)
build_unflags = -Os
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
    ; 1 = simulated sensor with realistic noise/glitches, 0 = real HC-SR04
    -DSENSOR_SIMULATION=1
    ; 1 = print raw readings only (record training data: training/capture_serial.py)
    -DLOG_RAW=0
    ; 80 / 160 / 240. 80 MHz is plenty (<1% CPU load) and draws roughly half the current of 240
    -DCPU_FREQ_MHZ=80
